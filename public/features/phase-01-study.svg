<rect x="0" y="0" width="1200" height="5" fill="#b84a2e"></rect><rect x="60" y="60" width="190.7999725341797" height="51" rx="25.5" fill="#f5f0e8" stroke="rgba(26, 22, 19, 0.12)" stroke-width="1.2"></rect><circle cx="90" cy="85.5" r="7" fill="#e8d78a"></circle><text x="109" y="93.42" font-family="&#34;Geist Mono&#34;, ui-monospace, Menlo, &#34;SFMono-Regular&#34;, Consolas, &#34;Courier New&#34;, monospace" font-size="22" fill="#1a1714">Structure</text><rect x="264.7999725341797" y="60" width="137.99998474121094" height="51" rx="25.5" fill="#f5f0e8" stroke="rgba(26, 22, 19, 0.12)" stroke-width="1.2"></rect><circle cx="294.7999725341797" cy="85.5" r="7" fill="#a9c7e0"></circle><text x="313.7999725341797" y="93.42" font-family="&#34;Geist Mono&#34;, ui-monospace, Menlo, &#34;SFMono-Regular&#34;, Consolas, &#34;Courier New&#34;, monospace" font-size="22" fill="#1a1714">Voice</text><rect x="416.7999572753906" y="60" width="164.3999786376953" height="51" rx="25.5" fill="#f5f0e8" stroke="rgba(26, 22, 19, 0.12)" stroke-width="1.2"></rect><circle cx="446.7999572753906" cy="85.5" r="7" fill="#b8d6b0"></circle><text x="465.7999572753906" y="93.42" font-family="&#34;Geist Mono&#34;, ui-monospace, Menlo, &#34;SFMono-Regular&#34;, Consolas, &#34;Courier New&#34;, monospace" font-size="22" fill="#1a1714">Imagery</text><rect x="595.1999359130859" y="60" width="151.19998168945312" height="51" rx="25.5" fill="#f5f0e8" stroke="rgba(26, 22, 19, 0.12)" stroke-width="1.2"></rect><circle cx="625.1999359130859" cy="85.5" r="7" fill="#e5b09a"></circle><text x="644.1999359130859" y="93.42" font-family="&#34;Geist Mono&#34;, ui-monospace, Menlo, &#34;SFMono-Regular&#34;, Consolas, &#34;Courier New&#34;, monospace" font-size="22" fill="#1a1714">Pacing</text><rect x="976.6000213623047" y="60" width="163.3999786376953" height="51" rx="25.5" fill="#f5f0e8" stroke="rgba(26, 22, 19, 0.12)" stroke-width="1.2"></rect><path d="M999.6000213623047 77.5 L1012.6000213623047 85.5 L999.6000213623047 93.5 Z" fill="#1a1714"></path><text x="1024.6000213623047" y="93.42" font-family="&#34;Geist Mono&#34;, ui-monospace, Menlo, &#34;SFMono-Regular&#34;, Consolas, &#34;Courier New&#34;, monospace" font-size="22" fill="#1a1714">Read it</text><rect x="217.51" y="187.92" width="258.13" height="42.20" rx="2" fill="#a9c7e0" fill-opacity="0.55"></rect><rect x="589.01" y="187.92" width="348.82" height="42.20" rx="2" fill="#b8d6b0" fill-opacity="0.55"></rect><rect x="191.20" y="251.92" width="257.68" height="42.20" rx="2" fill="#e8d78a" fill-opacity="0.55"></rect><rect x="616.62" y="251.92" width="96.52" height="42.20" rx="2" fill="#e5b09a" fill-opacity="0.55"></rect><line x1="222.51" y1="226.00" x2="470.64" y2="226.00" stroke="#a9c7e0" stroke-width="2.8" stroke-linecap="butt"></line><line x1="594.01" y1="226.00" x2="932.82" y2="226.00" stroke="#b8d6b0" stroke-width="2.8" stroke-linecap="butt"></line><line x1="196.20" y1="290.00" x2="443.87" y2="290.00" stroke="#e8d78a" stroke-width="2.8" stroke-linecap="butt"></line><line x1="621.62" y1="290.00" x2="708.14" y2="290.00" stroke="#e5b09a" stroke-width="2.8" stroke-linecap="butt"></line><text x="60" y="220" font-family="Georgia, &#34;Times New Roman&#34;, serif" font-size="36" fill="#1a1714" xml:space="preserve"><tspan>She had a </tspan><tspan>perpetual sense</tspan><tspan>, as she </tspan><tspan>watched the taxi cabs</tspan><tspan>,</tspan></text><text x="60" y="284" font-family="Georgia, &#34;Times New Roman&#34;, serif" font-size="36" fill="#1a1714" xml:space="preserve"><tspan>of being </tspan><tspan>out, out, far out</tspan><tspan> to sea and </tspan><tspan>alone</tspan><tspan>…</tspan></text><text x="60" y="348" font-family="Georgia, &#34;Times New Roman&#34;, serif" font-size="36" fill="#1a1714" xml:space="preserve"><tspan>she always had the feeling that it was very,</tspan></text><text x="60" y="412" font-family="Georgia, &#34;Times New Roman&#34;, serif" font-size="36" fill="#1a1714" xml:space="preserve"><tspan>very dangerous to live even one day.</tspan></text><line x1="320.033203125" y1="300" x2="320.033203125" y2="318" stroke="#e8d78a" stroke-width="2" stroke-linecap="round"></line><rect x="84.033203125" y="328" width="480" height="178" rx="6" fill="#1a1714" fill-opacity="0.10"></rect><rect x="80.033203125" y="322" width="480" height="178" rx="6" fill="#f5f0e8" stroke="rgba(26, 22, 19, 0.12)" stroke-width="1"></rect><rect x="80.033203125" y="322" width="5" height="178" rx="2" fill="#c9a84c"></rect><text x="110.033203125" y="362" font-family="&#34;Geist Mono&#34;, ui-monospace, Menlo, &#34;SFMono-Regular&#34;, Consolas, &#34;Courier New&#34;, monospace" font-size="18" letter-spacing="3.96" font-weight="500" fill="#b84a2e" text-anchor="start">STRUCTURE</text><text x="110.033203125" y="404" font-family="Georgia, &#34;Times New Roman&#34;, serif" font-size="22" fill="#1a1714" xml:space="preserve">“Out, out, far out” — the repetition pushes</text><text x="110.033203125" y="436" font-family="Georgia, &#34;Times New Roman&#34;, serif" font-size="22" fill="#1a1714" xml:space="preserve">further with each beat. The syntax</text><text x="110.033203125" y="468" font-family="Georgia, &#34;Times New Roman&#34;, serif" font-size="22" fill="#1a1714" xml:space="preserve">mirrors the feeling of being cast away.</text><rect x="60" y="790" width="1080" height="60" rx="30" fill="#b84a2e"></rect><text x="600" y="827.92" font-family="&#34;Geist Mono&#34;, ui-monospace, Menlo, &#34;SFMono-Regular&#34;, Consolas, &#34;Courier New&#34;, monospace" font-size="22" fill="#f5f0e8" text-anchor="middle">Continue to your writing exercise →</text></g>
